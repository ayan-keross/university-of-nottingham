server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
            
      discovery:
        locator:
          enabled: true  # Enable Eureka-based routing
          lower-case-service-id: true

      routes:
        - id: main-service
          uri: lb://uon-server
          predicates:
            - Path=/services/main/**
          filters:
            - StripPrefix=2

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/services/notification/**
          filters:
            - StripPrefix=2

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

